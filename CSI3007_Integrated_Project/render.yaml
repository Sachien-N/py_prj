# Render Blueprint for CSI3007 Integrated Project
# Seven independent services

services:
  # Central Integration Gateway
  - type: web
    name: csi3007-gateway
    env: python
    rootDir: CSI3007_Integrated_Project
    buildCommand: pip install -r requirements.txt
    startCommand: python run_cloud.py --service gateway
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

